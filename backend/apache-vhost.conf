<VirtualHost *:8080>
	ServerAdmin webmaster@localhost
	DocumentRoot ${APACHE_DOCUMENT_ROOT}

	<Directory ${APACHE_DOCUMENT_ROOT}>
		AllowOverride None
		Require all granted
		FallbackResource /index.php

		# mod_php (Apache 2.4.13+) ne transmet pas l'en-tête Authorization à
		# PHP par défaut, quel que soit le contenu du header envoyé par le
		# client. Sans cette ligne, tout token JWT envoyé en "Authorization:
		# Bearer ..." est silencieusement perdu avant d'atteindre Symfony :
		# chaque route protégée (/api/me, panneau admin, etc.) répond 401
		# "JWT Token not found" même avec un token valide. Valide uniquement
		# en contexte <Directory>/.htaccess, pas directement sous <VirtualHost>.
		CGIPassAuth On
	</Directory>

	# /api/docs sert l'UI Swagger (API Platform) : CSS/JS chargés depuis /assets (même origine)
	# et un bloc <script> inline pour l'initialisation. Le reste de l'API ne sert que du JSON,
	# d'où une policy stricte par défaut et une exception ciblée pour cette seule route.
	SetEnvIf Request_URI "^/api/docs" IS_API_DOCS

	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "DENY"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
	Header always set Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" env=IS_API_DOCS
	Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" env=!IS_API_DOCS

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

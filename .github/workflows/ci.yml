name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests-backend:
    name: Tests backend (PHPUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cesizen_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Installation des dépendances
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Génération des clés JWT
        working-directory: backend
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
        env:
          APP_ENV: test
          APP_SECRET: ci_secret_non_sensible

      - name: Préparation de la base de test
        working-directory: backend
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
        env:
          APP_ENV: test
          APP_SECRET: ci_secret_non_sensible
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/cesizen_test?serverVersion=8.0&charset=utf8mb4"

      - name: Exécution des tests
        working-directory: backend
        run: php bin/phpunit
        env:
          APP_ENV: test
          APP_SECRET: ci_secret_non_sensible
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/cesizen_test?serverVersion=8.0&charset=utf8mb4"

      - name: Audit de sécurité des dépendances
        working-directory: backend
        run: composer audit --no-dev

  code-quality:
    name: Qualité de code backend (phpqa)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # jakzal/phpqa embarque PHPStan, PHP-CS-Fixer, PHPMD et PHPCPD dans une
      # seule image : pas de composer require dev supplémentaire, un seul
      # binaire à faire évoluer. Chaque outil est bloquant : un écart sur le
      # code déjà en place ferait échouer ce job (voir backend/phpstan.neon,
      # .php-cs-fixer.php, phpmd.xml pour les seuils retenus et leur raison).
      - name: PHPStan (analyse statique, niveau 3)
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/project" -w /project \
            jakzal/phpqa:php8.4 phpstan analyse --configuration=phpstan.neon --no-progress

      - name: PHP-CS-Fixer (style PSR-12)
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/project" -w /project \
            jakzal/phpqa:php8.4 php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --diff

      - name: PHPMD (complexité, code mort)
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/project" -w /project \
            jakzal/phpqa:php8.4 phpmd src text phpmd.xml

      - name: PHPCPD (code dupliqué)
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/project" -w /project \
            jakzal/phpqa:php8.4 phpcpd src

  build-frontend:
    name: Build frontend (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        working-directory: frontend
        run: npm ci

      - name: Compilation
        working-directory: frontend
        run: npm run build

  build-images:
    name: Build des images Docker
    runs-on: ubuntu-latest
    needs: [ tests-backend, code-quality, build-frontend ]
    steps:
      - uses: actions/checkout@v4

      - name: Image backend
        run: docker build -t cesizen-backend ./backend

      - name: Image frontend
        run: docker build -t cesizen-frontend ./frontend
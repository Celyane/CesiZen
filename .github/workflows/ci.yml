name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # relance manuelle depuis l'onglet Actions

jobs:
  tests-backend:
    name: Tests backend (PHPUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cesizen_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Préparation du fichier .env
        working-directory: backend
        # composer install déclenche @auto-scripts (cache:clear, assets:install...),
        # qui boot le noyau Symfony et exige que .env existe physiquement — même
        # avant que les vraies variables d'environnement (APP_ENV, DATABASE_URL...)
        # ne soient injectées par les étapes suivantes. .env est gitignored (secrets
        # locaux), un checkout CI frais ne l'a donc jamais : sans cette étape,
        # composer install échoue avec "Unable to read the .env environment file"
        # (même correctif que backend/Dockerfile pour la même raison).
        run: cp .env.example .env

      - name: Installation des dépendances
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Génération des clés JWT
        working-directory: backend
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
        env:
          APP_ENV: test
          APP_SECRET: ci_secret_non_sensible

      - name: Préparation de la base de test
        working-directory: backend
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
        env:
          APP_ENV: test
          APP_SECRET: ci_secret_non_sensible
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/cesizen_test?serverVersion=8.0&charset=utf8mb4"

      - name: Exécution des tests
        working-directory: backend
        run: php bin/phpunit
        env:
          APP_ENV: test
          APP_SECRET: ci_secret_non_sensible
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/cesizen_test?serverVersion=8.0&charset=utf8mb4"

      - name: Audit de sécurité des dépendances
        working-directory: backend
        run: composer audit --no-dev

  code-quality:
    name: Qualité de code backend (phpqa)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # Nécessaire pour composer install ci-dessous : le runner ubuntu-latest
      # embarque bien un PHP par défaut, mais pas garanti en 8.4 ni avec les
      # extensions requises (intl, zip) — même image que le job tests-backend.
      - name: Installation de PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      # PHPStan a besoin de l'autoloader pour résoudre les classes (Symfony,
      # Doctrine, EasyAdmin...) — sans vendor/, tout le src/ ressort en
      # class.notFound. .env avant composer install pour la même raison que
      # dans le job tests-backend (@auto-scripts boot le noyau Symfony).
      - name: Installation des dépendances backend
        working-directory: backend
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist

      - name: PHPStan (analyse statique, niveau 3)
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/project" -w /project \
            jakzal/phpqa:php8.4 phpstan analyse --configuration=phpstan.neon --no-progress

      - name: PHP-CS-Fixer (style PSR-12)
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/project" -w /project \
            jakzal/phpqa:php8.4 php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --diff

      - name: PHPMD (complexité, code mort)
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/project" -w /project \
            jakzal/phpqa:php8.4 phpmd src text phpmd.xml

      - name: PHPCPD (code dupliqué)
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/project" -w /project \
            jakzal/phpqa:php8.4 phpcpd src

  build-frontend:
    name: Build frontend (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        working-directory: frontend
        run: npm ci

      - name: Compilation
        working-directory: frontend
        run: npm run build
services:
  db:
    image: mysql:8.0
    security_opt: [ "no-new-privileges:true" ]
    environment:
      MYSQL_DATABASE: cesizen
      MYSQL_USER: cesizen
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # AUCUN "ports:" : la base n'est joignable que par le backend, sur le
    # réseau interne "back". Pour l'inspecter depuis l'hôte :
    #   docker compose exec db mysql -ucesizen -p cesizen
    volumes:
      - db_data:/var/lib/mysql
    networks: [back]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucesizen", "-pcesizen"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    security_opt: [ "no-new-privileges:true" ]
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://cesizen:${DB_PASSWORD}@db:3306/cesizen?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy
    networks: [back, front]
    ports:
      # Restreint à la machine locale : utile pour appeler l'API directement
      # (Swagger, tests manuels) sans jamais être joignable depuis le réseau.
      # Publié sur les deux loopbacks (v4 et v6) : "localhost" peut se résoudre
      # en ::1 en premier selon le système, et échouerait sinon.
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8080/api/resources') !== false ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    security_opt: [ "no-new-privileges:true" ]
    ports:
      # Deux loopbacks pour que "localhost" fonctionne quelle que soit la
      # résolution DNS locale (v4 ou v6) — voir remarque équivalente ci-dessus.
      - "127.0.0.1:3443:8443"
      - "[::1]:3443:8443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [front]

networks:
  front:
  back:
    internal: true

volumes:
  db_data:
